name: Publish prepared FPV source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/FPV-Vehicle-Tracking-clean.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract prepared source
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("bootstrap/FPV-Vehicle-Tracking-clean.zip")
          with zipfile.ZipFile(archive, "r") as z:
              z.extractall(".")
          PY
          rm -rf bootstrap
          rm -f .github/workflows/publish-prepared-source.yml

      - name: Commit published project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish FPV Vehicle Tracking Studio v1 source and screenshots"
          git push
